[project]
name = "visionlab"
version = "0.1.0"
description = "Universal AI-assisted visual annotation application for computer vision datasets"
requires-python = ">=3.12"
dependencies = [
    "bitsandbytes>=0.50.1",
    "decord>=0.6.0",
    "einops>=0.8.2",
    "lmdb>=2.3.0",
    "numpy>=2.0",
    "opencv-python>=4.10",
    "peft>=0.20.0",
    "PySide6>=6.7",
    "PyYAML>=6.0",
    "timm>=1.0.28",
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.57.1,<4.58",
    "ultralytics>=8.3",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "pyinstaller>=6.10",
    "httpx>=0.27",
]


[project.scripts]
visionlab = "app.main:main"
traffic-annotator = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["app", "src"]

[tool.hatch.build.targets.wheel.force-include]
"pipeline_bridge.py" = "pipeline_bridge.py"
"requirements-colab.txt" = "requirements-colab.txt"
"notebooks/visionlab_colab_batch.ipynb" = "visionlab_colab_batch.ipynb"
