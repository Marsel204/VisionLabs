[project]
name = "traffic-annotator"
version = "0.1.0"
description = "AI-assisted annotation application for Indonesian traffic datasets"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=4.10",
    "PySide6>=6.7",
    "PyYAML>=6.0",
    "torch>=2.4",
    "transformers>=4.45",
    "ultralytics>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
traffic-annotator = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
