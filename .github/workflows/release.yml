name: Build & Release

# Pushing a tag like v1.2.0 builds the installers and publishes them as a GitHub Release.
# Installed copies of Anotara find that release through electron-updater and offer the update.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies (CPU PyTorch is enough for tests)
        run: |
          uv sync --extra dev --extra tuning
          uv pip install --reinstall torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Python tests
        run: uv run --no-sync pytest

      - name: Desktop tests and build
        working-directory: desktop
        run: |
          npm ci
          npm test
          npm run build

  package:
    name: Package ${{ matrix.name }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Python dependencies
        shell: bash
        run: uv sync --extra dev --extra tuning

      # PyPI's Linux torch pulls in the CUDA runtime (several GB); a GitHub release file may not
      # exceed 2 GiB, so Linux installers ship the CPU build. Windows PyPI wheels are CPU already.
      - name: Use CPU PyTorch on Linux
        if: runner.os == 'Linux'
        run: uv pip install --reinstall torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Freeze the Python engine
        shell: bash
        run: uv run --no-sync python scripts/build_backend.py

      - name: Set the app version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: desktop
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build and package the desktop app
        shell: bash
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            npx electron-builder --publish always
          else
            npx electron-builder --publish never
          fi

      - name: Upload installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Anotara-${{ matrix.name }}
          path: |
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 14
